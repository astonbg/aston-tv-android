name: Build Aston TV Mobile 5 for iPhone
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/iphone-recovery']
    paths:
      - 'ios-mobile5/**'
      - '.github/workflows/build-mobile5-ios.yml'
jobs:
  iphone:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate branded Aston TV app icon
        run: |
          mkdir -p ios-mobile5/AstonMobile5/Assets.xcassets/AppIcon.appiconset
          cat > ios-mobile5/icon.swift <<'SWIFT'
          import AppKit
          let image=NSImage(size:NSSize(width:1024,height:1024))
          image.lockFocus()
          NSColor(calibratedRed:0.035,green:0.06,blue:0.11,alpha:1).setFill()
          NSRect(x:0,y:0,width:1024,height:1024).fill()
          let plate=NSBezierPath(roundedRect:NSRect(x:178,y:178,width:668,height:668),xRadius:175,yRadius:175)
          NSColor(calibratedRed:0.08,green:0.17,blue:0.25,alpha:1).setFill()
          plate.fill()
          NSColor(calibratedRed:0.17,green:0.82,blue:0.92,alpha:1).setStroke()
          plate.lineWidth=18
          plate.stroke()
          let play=NSBezierPath()
          play.move(to:NSPoint(x:404,y:320))
          play.line(to:NSPoint(x:404,y:704))
          play.line(to:NSPoint(x:718,y:512))
          play.close()
          NSColor(calibratedRed:0.48,green:0.95,blue:0.96,alpha:1).setFill()
          play.fill()
          image.unlockFocus()
          guard let tiff=image.tiffRepresentation, let bitmap=NSBitmapImageRep(data:tiff),
                let png=bitmap.representation(using:.png,properties:[:]) else {fatalError("Could not render Aston icon")}
          try png.write(to:URL(fileURLWithPath:"ios-mobile5/AstonMobile5/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          SWIFT
          swift ios-mobile5/icon.swift
          cat > ios-mobile5/AstonMobile5/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
      - name: Generate native Xcode project
        run: cd ios-mobile5 && xcodegen generate
      - name: Test deployed Gateway value compatibility
        run: |
          swiftc ios-mobile5/AstonMobile5/GatewayContract.swift ios-mobile5/tests/main.swift -o "$RUNNER_TEMP/contract-tests"
          "$RUNNER_TEMP/contract-tests"
      - name: Test private Gateway functions and asynchronous channel selection
        run: |
          node ios-mobile5/tests/gateway-playback.test.cjs
          swiftc ios-mobile5/tests/GatewayWebKitSmoke.swift -o "$RUNNER_TEMP/webkit-test" -framework AppKit -framework WebKit
          "$RUNNER_TEMP/webkit-test" ios-mobile5/AstonMobile5/GatewayPlayback.js
      - name: Build iPhone arm64 app without signing
        run: |
          xcodebuild -project ios-mobile5/AstonMobile5.xcodeproj -scheme AstonMobile5 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/aston5" CODE_SIGNING_ALLOWED=NO build
      - name: Verify bundle and executable
        run: |
          APP="$RUNNER_TEMP/aston5/Build/Products/Release-iphoneos/AstonMobile5.app"
          test -s "$APP/AstonMobile5"
          test -s "$APP/GatewayPlayback.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "eu.astonserver.astontv.mobile5"
          /usr/bin/file "$APP/AstonMobile5"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = "5.2.1"
          lipo "$APP/AstonMobile5" -verify_arch arm64
          test ! -e "$APP/embedded.mobileprovision"
          if codesign -d "$APP" 2>/dev/null; then echo 'Unexpected code signature'; exit 1; fi
          xcrun vtool -show-build "$APP/AstonMobile5" | tee "$GITHUB_WORKSPACE/device-build.txt"
          grep -q 'platform IOS' "$GITHUB_WORKSPACE/device-build.txt"
      - name: Package unsigned iPhone IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/aston5/Build/Products/Release-iphoneos/AstonMobile5.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry "$GITHUB_WORKSPACE/AstonTV-Mobile-5.2.1-UNSIGNED.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/AstonTV-Mobile-5.2.1-UNSIGNED.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/AstonTV-Mobile-5.2.1-UNSIGNED.ipa" > "$GITHUB_WORKSPACE/SHA256SUMS.txt"
      - name: Build and launch simulator (not a home-server playback test)
        run: |
          xcodebuild -project ios-mobile5/AstonMobile5.xcodeproj -scheme AstonMobile5 -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/aston-sim" CODE_SIGNING_ALLOWED=NO build
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          DEVICE=$(python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/devices.json")); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/aston-sim/Build/Products/Debug-iphonesimulator/AstonMobile5.app"
          xcrun simctl launch "$DEVICE" eu.astonserver.astontv.mobile5
          sleep 5
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/simulator.png"
          xcrun simctl list devices booted > "$GITHUB_WORKSPACE/simulator-device.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: AstonTV-Mobile-5.2.1-iPhone-Unsigned-IPA
          path: |
            AstonTV-Mobile-5.2.1-UNSIGNED.ipa
            SHA256SUMS.txt
            device-build.txt
            simulator.png
            simulator-device.txt
          if-no-files-found: error
