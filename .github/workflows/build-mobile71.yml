name: Build Aston TV Mobile 7.1 APK
on:
  push:
    paths:
      - 'mobile71/**'
      - '.github/workflows/build-mobile71.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK
        working-directory: mobile71
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AstonTV-Mobile-7.1-Android-APK
          path: mobile71/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
