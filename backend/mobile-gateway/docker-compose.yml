services:
  gateway:
    image: python:3.12-alpine
    container_name: aston-premium4-gateway
    working_dir: /app
    command: ["python3", "-u", "gateway.py"]
    env_file: .env
    environment:
      ASTON_PUBLIC_PORT: "8416"
      ASTON_PUBLIC_SESSION_FILE: "/data/gateway_sessions.json"
    ports:
      - "10.10.10.179:8424:8416"
    volumes:
      - ./app:/app:ro
      - ./session-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8416/healthz',timeout=4)"]
      interval: 30s
      timeout: 8s
      retries: 3
