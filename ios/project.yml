name: AstonTV
options:
  bundleIdPrefix: eu.astonserver
targets:
  AstonTV:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AstonTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.astonserver.astontv.ios
        PRODUCT_NAME: AstonTV
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aston TV Premium
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
