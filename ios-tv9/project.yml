name: AstonTV9
options:
  bundleIdPrefix: eu.astonserver
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  AstonTV9:
    type: application
    platform: iOS
    sources:
      - AstonTV9
    info:
      path: AstonTV9/Info.plist
      properties:
        CFBundleDisplayName: Aston TV
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: Камерата се ползва само за сканиране на QR кода при сдвояване на телевизор или друго устройство.
        CFBundleURLTypes:
          - CFBundleURLName: eu.astonserver.astontv.pair
            CFBundleURLSchemes: [astontv]
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.astonserver.astontv.mobile
        PRODUCT_NAME: AstonTV
        MARKETING_VERSION: 10.0.0
        CURRENT_PROJECT_VERSION: 1000
        GENERATE_INFOPLIST_FILE: YES
